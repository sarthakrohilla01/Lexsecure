name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for secrets in tracked files
        run: |
          if git grep -nE 'sk-nry-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----'; then
            echo "::error::A credential appears to be committed. Remove it and rotate the key."
            exit 1
          fi
          echo "No credentials found in tracked files."

      - name: Byte-compile
        run: python -m compileall -q app scripts tests seed.py

      - name: Lint
        run: ruff check app scripts tests seed.py ../sample_documents

      - name: Run test suite
        run: python -m pytest tests/ -q --no-header

  frontend-build:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          config: |
            paths:
              - backend/app
            queries:
              - uses: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  license-check:
    name: Licence and contribution policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Licence present
        run: |
          for f in LICENSE CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the repository root."
              exit 1
            fi
          done
          grep -q "Business Source License" LICENSE || {
            echo "::error::LICENSE is not the expected Business Source License."
            exit 1
          }
          echo "Licence and governance files are in place."
